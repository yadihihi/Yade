<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pipikakaland</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4eee5;color:#29252b;font-family:"Chalkboard SE","Comic Sans MS",system-ui,sans-serif}
#app{max-width:440px;min-height:100vh;margin:auto;background:#fffaf2;padding:16px}
h1,h2,p{text-align:center}h1{font-size:28px;margin:5px}.hide{display:none!important}
.panel{border:2px solid #29252b;border-radius:22px;padding:13px;background:#fffdf8}
.eggs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:18px 0}
.eggwrap{text-align:center}.egg{width:105px;height:135px;margin:auto;border:3px solid #29252b;border-radius:52% 48% 48% 52%/60% 60% 40% 40%;cursor:pointer}
.room{height:365px;position:relative;border:2px solid #29252b;border-radius:24px;overflow:hidden;background:#f0ddbd;margin:12px 0}
.floor{position:absolute;bottom:0;width:100%;height:36%;background:#e7c89f;border-top:2px solid #29252b}
.window{position:absolute;right:22px;top:25px;width:115px;height:115px;border:3px solid #29252b;border-radius:55px 55px 4px 4px;background:#bfe1f2}
.window:after{content:"☀️";position:absolute;right:10px;top:8px;font-size:26px}
.rug{position:absolute;left:42px;bottom:28px;width:275px;height:82px;border:2px solid #29252b;border-radius:50%;background:#efabc4}
.bed{position:absolute;left:112px;bottom:26px;width:215px;height:85px;border:3px solid #29252b;border-radius:48%;background:#c99f78;display:none}
.bed:after{content:"";position:absolute;left:18px;right:18px;top:15px;bottom:15px;border-radius:48%;background:#f5dfc9}
.pet{position:absolute;left:50%;bottom:67px;transform:translateX(-50%);width:195px;height:195px;object-fit:contain;filter:drop-shadow(0 3px 1px #0002);transition:.25s}
.pet.sleeping{bottom:48px;transform:translateX(-50%) scale(.88) rotate(4deg);filter:brightness(.82) drop-shadow(0 3px 1px #0002)}
.chew{animation:chew .18s 5}@keyframes chew{50%{transform:translateX(-50%) scale(1.03,.95)}}
.bounce{animation:b .35s}@keyframes b{50%{transform:translateX(-50%) translateY(-16px) rotate(3deg)}}
.shake{animation:shake .5s 3}@keyframes shake{25%{transform:translateX(-50%) rotate(-6deg)}75%{transform:translateX(-50%) rotate(6deg)}}
.stats{display:grid;gap:6px}.stat{display:grid;grid-template-columns:28px 1fr 30px;gap:6px;align-items:center}
.bar{height:15px;border:2px solid #29252b;border-radius:12px;background:#fff;overflow:hidden}.fill{height:100%;transition:.3s}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{font:inherit;font-weight:bold;border:2px solid #29252b;border-radius:16px;padding:12px;background:#fff;box-shadow:0 3px #29252b;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px #29252b}
.msg{min-height:34px;text-align:center;font-weight:bold;padding-top:5px}
.top{display:flex;justify-content:space-between;align-items:center}.xp{text-align:center;margin:8px}.tiny{font-size:12px;opacity:.65;text-align:center}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
.sheet{width:min(430px,100%);background:#fffaf2;border:2px solid #29252b;border-radius:24px;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{font-size:20px;padding:14px}
.foodfloat{position:absolute;left:50%;bottom:205px;transform:translateX(-50%);font-size:48px;z-index:7;animation:foodIn 1s forwards}
@keyframes foodIn{0%{transform:translate(-50%,-50px);opacity:0}45%{transform:translate(-50%,55px);opacity:1}100%{transform:translate(-50%,75px);opacity:0}}
.shower{position:absolute;right:55px;top:65px;font-size:56px;z-index:8;animation:showerMove 2s ease-in-out}
@keyframes showerMove{0%{right:55px}50%{right:220px}100%{right:55px}}
.bubbles{position:absolute;left:65px;bottom:70px;font-size:34px;z-index:6;animation:bubbles 2s}
@keyframes bubbles{0%{opacity:0;transform:translateY(20px)}40%{opacity:1}100%{opacity:0;transform:translateY(-110px)}}
.zzz{position:absolute;right:80px;bottom:190px;font-size:30px;z-index:9;animation:zzz 2.5s infinite}
@keyframes zzz{0%{opacity:0;transform:translateY(15px)}50%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.overlay{position:absolute;inset:0;background:#2f315075;z-index:4;pointer-events:none}
.persona{font-size:13px;text-align:center;margin:4px 0 10px}

.evoOverlay{position:fixed;inset:0;background:#1f1830dd;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.evoCard{width:min(390px,100%);background:#fff8ef;border:3px solid #29252b;border-radius:28px;padding:26px;text-align:center;box-shadow:0 8px 0 #29252b}
.evoTitle{font-size:28px;font-weight:900;margin-bottom:14px}
.spiralWrap{position:relative;height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.spiral{width:180px;height:180px;border-radius:50%;background:repeating-radial-gradient(circle at center,#d87be8 0 12px,#ffcf71 12px 24px,#8ed4c2 24px 36px,#f59bb8 36px 48px);animation:spin 1.05s linear infinite;border:3px solid #29252b;filter:saturate(1.1)}
@keyframes spin{to{transform:rotate(360deg)}}
.evoPet{position:absolute;width:165px;height:165px;object-fit:contain;filter:drop-shadow(0 3px 1px #0003)}
.flash{animation:flash .55s ease-in-out 2}
@keyframes flash{50%{filter:brightness(4) drop-shadow(0 0 20px white)}}
.evoText{font-size:21px;font-weight:800;min-height:60px;display:flex;align-items:center;justify-content:center}
.evoBtn{width:100%;margin-top:12px;background:#f4b3d0}
</style></head>
<body><main id="app">
<section id="choose">
<h1>✨ Pipikakaland ✨</h1><p>Wähle dein Ei</p><div class="eggs" id="eggs"></div>
</section>

<section id="hatch" class="hide" style="text-align:center;padding-top:120px">
<h2>Es bewegt sich…</h2><div id="hatchEgg" class="egg"></div><p>🥚 ✨ 🥚</p>
</section>

<section id="game" class="hide">
<div class="top"><button onclick="newPet()">↩</button><h1 id="petname"></h1><span>🪙 <b id="coins">0</b></span></div>
<div class="persona" id="persona"></div>
<div class="panel stats">
<div class="stat">❤️<div class="bar"><div id="love" class="fill" style="background:#ef91ad"></div></div><b id="loveT"></b></div>
<div class="stat">🍓<div class="bar"><div id="food" class="fill" style="background:#9ac58e"></div></div><b id="foodT"></b></div>
<div class="stat">🫧<div class="bar"><div id="clean" class="fill" style="background:#9ec9e7"></div></div><b id="cleanT"></b></div>
<div class="stat">🌙<div class="bar"><div id="energy" class="fill" style="background:#bba3dd"></div></div><b id="energyT"></b></div>
</div>
<div class="xp">✨ Fotzigkeitslevel: <b id="xpT"></b></div>

<div class="room" id="room"><div class="window"></div><div class="floor"></div><div class="rug"></div><div class="bed" id="bed"></div><img id="pet" class="pet"></div>
<div id="msg" class="msg">Dein Wesen wartet auf dich ♡</div>
<div class="actions">
<button style="background:#c9e1b7" onclick="openFood()">🍓 Füttern</button>
<button style="background:#c5e0f1" onclick="openPlay()">🧶 Spielen</button>
<button style="background:#d8c5ec" onclick="wash()">🫧 Waschen</button>
<button style="background:#f6e4a6" onclick="sleepPet()">🌙 Schlafen</button>
</div>
<p class="tiny">Jedes Wesen hat eigene Vorlieben und Abneigungen.</p>
</section>

<div id="modal" class="modal hide"><div class="sheet"><h2 id="modalTitle"></h2><div class="grid" id="choices"></div><button onclick="closeModal()" style="width:100%;margin-top:12px">Schließen</button></div></div>

<div id="evoOverlay" class="evoOverlay hide">
  <div class="evoCard">
    <div id="evoTitle" class="evoTitle">Oh?</div>
    <div class="spiralWrap">
      <div id="spiral" class="spiral"></div>
      <img id="evoPet" class="evoPet">
    </div>
    <div id="evoText" class="evoText">Was passiert hier…?</div>
    <button id="evoBtn" class="evoBtn hide" onclick="closeEvolution()">Weiter</button>
  </div>
</div>
</main>

const COLORS={"zaza": "#f5d92e", "bibi": "#8fb497", "gloob": "#d989dc", "kiki": "#ef9238", "bobo": "#fff7d9", "lulu": "#9d69c8"};
const P={"zaza": {"trait": "laut, eitel & temperamentvoll", "fav": "strawberry", "hate": "trash", "play": "mirror", "sleep": 0.32, "clean": 0.18}, "bibi": {"trait": "sch\u00fcchtern, sensibel & anh\u00e4nglich", "fav": "apple", "hate": "soap", "play": "plush", "sleep": 0.22, "clean": 0.2}, "gloob": {"trait": "verfressen, seltsam & neugierig", "fav": "trash", "hate": "soap", "play": "squeak", "sleep": 0.25, "clean": 0.22}, "kiki": {"trait": "w\u00e4hlerisch, stolz & diva", "fav": "strawberry", "hate": "trash", "play": "feather", "sleep": 0.23, "clean": 0.18}, "bobo": {"trait": "chaotisch, fr\u00f6hlich & unberechenbar", "fav": "soap", "hate": "apple", "play": "ball", "sleep": 0.24, "clean": 0.24}, "lulu": {"trait": "vertr\u00e4umt, ruhig & empfindlich", "fav": "apple", "hate": "trash", "play": "bubble", "sleep": 0.28, "clean": 0.38}};
const FOODS={"apple": {"emoji": "\ud83c\udf4e", "name": "Apfel"}, "strawberry": {"emoji": "\ud83c\udf53", "name": "Erdbeere"}, "trash": {"emoji": "\ud83d\uddd1\ufe0f", "name": "M\u00fcll"}, "soap": {"emoji": "\ud83e\uddfc", "name": "Seife"}};
const TOYS={"mirror": {"emoji": "\ud83e\ude9e", "name": "Spiegel"}, "plush": {"emoji": "\ud83e\uddf8", "name": "Kuscheltier"}, "squeak": {"emoji": "\ud83d\udc25", "name": "Quietschi"}, "feather": {"emoji": "\ud83e\udeb6", "name": "Feder"}, "ball": {"emoji": "\u26bd", "name": "Ball"}, "bubble": {"emoji": "\ud83e\udee7", "name": "Blubberblasen"}};
let s=JSON.parse(localStorage.getItem("pipikakalandSave")||"null");
const $=id=>document.getElementById(id), clamp=n=>Math.max(0,Math.min(100,n));

function buildEggs(){Object.keys(COLORS).forEach(n=>{let w=document.createElement("div");w.className="eggwrap";w.innerHTML=`<div class="egg" style="background:${COLORS[n]}"></div><b>${n.toUpperCase()}</b>`;w.onclick=()=>choose(n);$("eggs").appendChild(w)})}
function choose(n){$("choose").classList.add("hide");$("hatch").classList.remove("hide");$("hatchEgg").style.background=COLORS[n];$("hatchEgg").style.animation="shake .5s infinite";setTimeout(()=>{s={name:n,love:80,food:80,clean:80,energy:80,xp:0,coins:0,glam:false,last:Date.now()};save();showGame()},1800)}
function showGame(){$("choose").classList.add("hide");$("hatch").classList.add("hide");$("game").classList.remove("hide");decay();render()}
function decay(){if(!s)return;let m=(Date.now()-s.last)/60000;let p=P[s.name];s.food=clamp(s.food-m*(s.name==="gloob"?.52:.35));s.clean=clamp(s.clean-m*p.clean);s.energy=clamp(s.energy-m*p.sleep);s.love=clamp(s.love-m*(s.name==="bibi"?.25:.12));s.last=Date.now();save()}
function render(){["love","food","clean","energy"].forEach(k=>{$ (k).style.width=s[k]+"%";$(k+"T").textContent=Math.round(s[k])});$("petname").textContent="♡ "+s.name.toUpperCase()+" ♡";$("persona").textContent=P[s.name].trait;$("coins").textContent=s.coins;$("xpT").textContent=s.glam?"OBERFOTZIG ✨":Math.floor(s.xp)+" / 20";$("pet").src=ASSETS[s.name][s.glam?"glam":"base"];save()}
function save(){if(s)localStorage.setItem("pipikakalandSave",JSON.stringify(s))}

function openFood(){$("modalTitle").textContent="Was möchtest du füttern?";$("choices").innerHTML="";Object.entries(FOODS).forEach(([k,v])=>{let b=document.createElement("button");b.className="choice";b.textContent=v.emoji+" "+v.name;b.onclick=()=>feed(k);$("choices").appendChild(b)});$("modal").classList.remove("hide")}
function feed(k){closeModal();decay();let p=P[s.name], amount=15, love=0, msg="Ganz okay.";if(k===p.fav){amount=27;love=6;msg="😍 Lieblingsfutter!"}else if(k===p.hate){amount=4;love=-6;msg="🤢 Das hasst "+s.name.toUpperCase()+"!"}s.food=clamp(s.food+amount);s.love=clamp(s.love+love);s.xp+=k===p.fav?3:1;s.coins+=1;foodAnim(FOODS[k].emoji,msg);levelCheck();render()}
function foodAnim(emoji,msg){let f=document.createElement("div");f.className="foodfloat";f.textContent=emoji;$("room").appendChild(f);$("pet").classList.add("chew");setTimeout(()=>{$("pet").classList.remove("chew");f.remove();$("msg").textContent=msg},1000)}

function openPlay(){$("modalTitle").textContent="Womit soll gespielt werden?";$("choices").innerHTML="";Object.entries(TOYS).forEach(([k,v])=>{let b=document.createElement("button");b.className="choice";b.textContent=v.emoji+" "+v.name;b.onclick=()=>playWith(k);$("choices").appendChild(b)});$("modal").classList.remove("hide")}
function playWith(k){closeModal();decay();let fav=P[s.name].play;if(k===fav){s.love=clamp(s.love+24);s.xp+=3;$("msg").textContent="💖 Lieblingsspielzeug!"}else{s.love=clamp(s.love+12);s.xp+=1;$("msg").textContent="Ganz nett 😌"}s.energy=clamp(s.energy-4);s.coins+=2;$("pet").classList.add("bounce");setTimeout(()=>$("pet").classList.remove("bounce"),420);levelCheck();render()}

function wash(){decay();let sh=document.createElement("div");sh.className="shower";sh.textContent="🚿";let bb=document.createElement("div");bb.className="bubbles";bb.textContent="🫧 🫧 🫧\n🫧 🫧";$("room").append(sh,bb);$("msg").textContent="Duschen…";setTimeout(()=>{s.clean=clamp(s.clean+35);s.xp+=2;s.coins+=1;sh.remove();bb.remove();$("msg").textContent="✨ Blitzsauber!";levelCheck();render()},2000)}

function sleepPet(){decay();$("bed").style.display="block";$("rug").style.display="none";$("pet").classList.add("sleeping");let dark=document.createElement("div");dark.className="overlay";let z=document.createElement("div");z.className="zzz";z.textContent="Z z z";$("room").append(dark,z);$("msg").textContent="Schlaf gut…";setTimeout(()=>{s.energy=clamp(s.energy+38);s.xp+=2;$("pet").classList.remove("sleeping");$("bed").style.display="none";$("rug").style.display="block";dark.remove();z.remove();$("msg").textContent="🌙 Ausgeschlafen!";levelCheck();render()},3500)}


function levelCheck(){
  if(s.xp>=20&&!s.glam){
    startEvolution();
  }
}
function startEvolution(){
  const ov=$("evoOverlay"), ep=$("evoPet"), et=$("evoText"), title=$("evoTitle"), btn=$("evoBtn");
  ov.classList.remove("hide");
  ep.src=ASSETS[s.name].base;
  title.textContent="Oh?";
  et.textContent="Was passiert hier…?";
  btn.classList.add("hide");
  setTimeout(()=>{title.textContent="Fotzigkeitslevel erreicht!"; et.textContent="Irgendwas verändert sich…"; ep.classList.add("flash");},2200);
  setTimeout(()=>{
    s.glam=true; save();
    ep.src=ASSETS[s.name].glam;
    ep.classList.remove("flash");
    title.textContent="✨ "+s.name.toUpperCase()+" ✨";
    et.textContent=s.name.toUpperCase()+" ist jetzt OBERFOTZIG!";
    btn.classList.remove("hide");
    render();
  },4200);
}
function closeEvolution(){
  $("evoOverlay").classList.add("hide");
  $("msg").textContent="✨ "+s.name.toUpperCase()+" ist jetzt OBERFOTZIG! ✨";
}
